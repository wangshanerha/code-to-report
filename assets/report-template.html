muted)}section{padding-top:55px;scroll-margin-top:15px}h2{font-size:clamp(24px,2.5vw,32px);letter-spacing:-.03em;line-height:1.4;margin:9px 0 22px}h3{font-size:18px;line-height:1.5;margin:18px 0 12px}h4{font-size:13px;margin:18px 0 8px}p{margin:10px 0 16px}.muted{color:var(--muted);font-size:13px}.callout{background:var(--teal-bg);border-left:3px solid var(--teal);padding:18px 22px;margin:24px 0}.callout p:last-child{margin-bottom:0}.tech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tech{border:1px solid var(--line);padding:23px;border-radius:8px}.tech h3{font-size:17px}.tech p{font-size:13px}.flow-panel{border:1px solid #ccd9d3;border-radius:10px;overflow:hidden;margin-top:25px;background:#f8faf6}.toolbar{background:#fffefa;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:12px}.toolbar label{display:flex;align-items:center;gap:10px}.toolbar select{max-width:380px;background:#f8faf6;border:1px solid #c9d7cf;border-radius:5px;color:var(--ink);padding:7px 10px}.zoom-controls{display:flex;gap:5px;white-space:nowrap}.zoom-controls button{background:white;border:1px solid #ced9d3;border-radius:4px;padding:5px 10px;color:var(--ink);font-size:12px}.legend{padding:10px 18px;font-size:10px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}.graph-scroll{overflow:auto;max-height:780px;padding:5px 12px 12px;background-image:radial-gradient(#dce5df .7px,transparent .7px);background-size:16px 16px}.flow-svg{display:block;max-width:none;height:auto;margin:auto}.node rect,.node>path{fill:#fffefa;stroke:#9bb7ad;stroke-width:1.3}.node.decision>path{fill:var(--amber-bg);stroke:#ba944e}.node.terminal rect{fill:#edf2f8;stroke:#95acc2}.node text{font-family:system-ui,"Microsoft YaHei",sans-serif;pointer-events:none}.node .node-id{font:10px Consolas,monospace;letter-spacing:1px;fill:#69877c}.node .node-title{font-size:15px;font-weight:650;fill:var(--ink)}.node .node-sub px;color:var(--muted);margin-bottom:0}.evidence a{color:#557567}.live-io{font-size:12px}.live-io:empty{display:none}.live-io .io-grid{background:var(--blue-bg);padding:15px;border-radius:6px}.live-note{color:var(--blue)}.example-card,.module-card{padding:25px;border:1px solid var(--line);border-radius:8px;margin:18px 0;background:white}.example-card>h3{font-size:23px}.example-card details{margin-top:14px}details{border-top:1px solid var(--line);padding:14px 0}summary{font-size:13px;color:var(--teal);overflow-wrap:anywhere}details[open]>summary{margin-bottom:13px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{background:var(--teal-bg);color:#3f6253;font-weight:600}td pre{margin:0;min-width:210px;font-size:11px}td:first-child{min-width:65px}.verification-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.verification-grid article{border:1px solid var(--line);padding:22px;border-radius:7px}.verification-grid p{font-size:13px}.source-card{scroll-margin-top:30px}.source-card pre{background:#19383b;color:#e7eee7;max-height:500px;overflow:auto;white-space:pre;font-size:11px}.source-card>a{font-size:12px}footer{border-top:1px solid var(--line);margin-top:55px;padding-top:22px;font-size:11px;color:var(--muted)}.back-top{position:fixed;bottom:22px;right:22px;background:var(--rail);color:white;text-decoration:none;padding:9px 14px;border-radius:5px;font-size:11px;z-index:5}.noscript{background:var(--amber-bg);padding:14px;font-size:13px}.print-button{background:transparent;border:1px solid #c7d7cc;border-radius:5px;padding:6px 12px;color:var(--teal);font-size:11px;cursor:pointer}
@media(min-width:1600px){main{padding-left:75px;padding-right:75px}}
@media(max-width:1000px){.app{grid-template-columns:190px minmax(0,1fr)}.rail{padding:28px 17px}.toolbar{flex-wrap:wrap}.toolbar select{max-width:290px}}
@media(max-width:760px){.app{display:block}.rail{height:auto;position:static;padding:22px}.brand small{display:inline;margin-left:12px}.rail nav{display:flex;overflow-x:auto;gap:18px;margin-top:16px}.rail nav a{white-space:nowrap;font-size:11px}.rail-footer,.rail-mark{display:none}main{padding:0 18px 40px}.hero{padding-top:35px}.hero h1{font-size:34px}.tech-grid,.verification-grid,.io-grid{grid-template-columns:1fr}.toolbar{padding:12px}.toolbar label{width:100%;display:block}.toolbar select{max-width:100%;width:100%;margin-top:6px}.step-card{padding:19px}.graph-scroll{max-height:640px}.legend{gap:8px}.meta-strip{align-items:flex-start}.back-top{right:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{html{scroll-behavior:auto}body{background:white;font-size:10pt}.app{display:block}.rail,.toolbar,.back-top,.print-button,.live-io{display:none}main{padding:0}.hero{padding-top:0}section{padding-top:25px}h2,h3,h4{break-after:avoid}.flow-panel{overflow:visible;border:0}.graph-scroll{max-height:none;overflow:visible;padding:0;background:none}.flow-svg{width:100%!important;height:auto!important;max-height:none}.flow-panel.has-trace .node,.flow-panel.has-trace .edge{opacity:1}.edge path{stroke:#51655b}.step-card,.tech,.module-card,.verification-grid article{break-inside:avoid;box-shadow:none}.step-card{padding:15px}.step-list{display:block}.step-card{margin-bottom:14px}.source-card pre{max-height:none;overflow:visible;white-space:pre-wrap}.source-card:not([open]){display:block}.source-card>*:not(summary){display:block!important}details>*:not(summary){display:block!important}.table-scroll{overflow:visible}td pre{min-width:0}table{table-layout:fixed}.io-grid{grid-template-columns:1fr 1fr}.tech-grid,.verification-grid{grid-template-columns:1fr 1fr}a{color:inherit}}

<body id="top">
<div class="app"><aside class="rail"><div class="brand">Code to Report<small>READ · TRACE · EXPLAIN</small></div><div class="rail-mark">↳</div><nav aria-label="报告目录">@@NAV@@</nav><div class="rail-footer">完整流程 / 明确分支<br>输入输出 / 贯穿实例<br><br>LOCAL HTML · OFFLINE READY</div></aside>
<main><header class="hero"><p class="kicker">SOURCE CODE / TECHNICAL FIELD NOTES</p><h1>@@TITLE@@</h1><p class="subtitle">@@SUBTITLE@@</p><p class="version">@@VERSION@@</p><div class="meta-strip"><span class="tag">@@COUNTS@@</span><button type="button" class="print-button">打印 / 保存 PDF</button></div></header><noscript><p class="noscript">当前未启用 JavaScript。完整图、步骤、源码与贯穿案例仍可阅读；路径高亮和缩放不可用。</p></noscript>@@BODY@@<footer>@@FOOTER@@</footer></main></div><a class="back-top" href="#top">返回顶部 ↑</a>
<script id="report-data" type="application/json">@@PAYLOAD@@</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent);
const examples=new Map(data.examples.map(e=>[e.id,e]));
const plain=value=>typeof value==='string'?value:Array.isArray(value)&&value.length<=16?JSON.stringify(value):JSON.stringify(value,null,2);
function makeIO(label,value){const wrap=document.createElement('div');const title=document.createElement('strong');title.textContent=label;const pre=document.createElement('pre');const code=document.createElement('code');code.textContent=plain(value);pre.append(code);wrap.append(title,pre);return wrap;}
function updateFlow(section,id){
 const fid=section.id,panel=section.querySelector('.flow-panel'),example=examples.get(id),visits=example?.paths?.[fid]||[];
 panel.classList.toggle('has-trace',Boolean(id));
 const ids=new Set(visits.map(v=>v.node));const pairs=new Set(visits.slice(1).map((v,i)=>visits[i].node+'>'+v.node));
 panel.querySelectorAll('.node').forEach(n=>n.classList.toggle('visited',ids.has(n.dataset.node)));
 panel.querySelectorAll('.edge').forEach(e=>e.classList.toggle('visited',pairs.has(e.dataset.from+'>'+e.dataset.to)));
 panel.querySelector('.path-status').textContent=!id?'完整流程 · 每条箭头已标注条件或数据':visits.length?example.title+' ｜ '+visits.map(v=>v.node).join(' → '):'本例未调用此子流程。其他流程和下方案例仍可查看。';
 section.querySelectorAll('.step-card').forEach(card=>{const nid=card.id.slice(5);const live=card.querySelector('.live-io');live.replaceChildren();if(!id)return;const matching=visits.filter(v=>v.node===nid);const note=document.createElement('p');note.className='live-note';note.textContent=matching.length?'本例数据：'+example.title+'（'+example.provenance+'）':'本例未经过此步骤';live.append(note);matching.forEach((v,i)=>{const grid=document.createElement('div');grid.className='io-grid';grid.append(makeIO(matching.length>1?'第 '+(i+1)+' 次输入':'本步输入',v.input),makeIO('本步输出',v.output));live.append(grid);});});
}
document.querySelectorAll('.case-select').forEach(select=>select.addEventListener('change',()=>{document.querySelectorAll('.case-select').forEach(other=>{other.value=select.value;updateFlow(other.closest('.flow-section'),select.value);});}));
function fit(panel){const svg=panel.querySelector('svg'),area=panel.querySelector('.graph-scroll');const natural=svg.viewBox.baseVal.width;svg.dataset.zoom='1';svg.style.width=Math.min(natural,Math.max(300,area.clientWidth-28))+'px';svg.dataset.base=String(parseFloat(svg.style.width));}
document.querySelectorAll('.flow-panel').forEach(panel=>{fit(panel);panel.querySelectorAll('[data-zoom]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.zoom==='reset'){fit(panel);return;}const svg=panel.querySelector('svg');const zoom=Math.max(.5,Math.min(3,(Number(svg.dataset.zoom)||1)+Number(button.dataset.zoom)*.25));svg.dataset.zoom=String(zoom);svg.style.width=(Number(svg.dataset.base)*zoom)+'px';}));});
let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>document.querySelectorAll('.flow-panel').forEach(fit),120);});
document.querySelector('.print-button').addEventListener('click',()=>window.print());
document.querySelectorAll('a[href^="#source-"]').forEach(a=>a.addEventListener('click',()=>{const target=document.getElementById(a.getAttribute('href').slice(1));if(target)target.open=true;}));
const initial=document.getElementById(location.hash.slice(1));if(initial?.tagName==='DETAILS')initial.open=true;
})();
</script></body></html>
